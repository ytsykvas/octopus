# Packaging for distribution outside the App Store (PROJECT.md §6).
#
# Signing is wired but off by default: `npm run dist` produces an unsigned
# build, `npm run dist:signed` a signed and notarised one. The difference is
# credentials, not configuration — see docs/releasing.md.
appId: com.ytsykvas.octopus
productName: Octopus
copyright: Copyright © 2026 Yurii Tsykvas

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# The file icons are copied into `out/` by the build, and their MIT licence
# asks for its notice to travel with them. Nothing else of `vendor/` is packed.
extraResources:
  - from: vendor/catppuccin-icons/LICENSE
    to: licenses/catppuccin-icons.LICENSE

# Two dependencies are executables rather than JavaScript and cannot be run
# from inside an asar archive: the terminal's native binding, and the Claude
# Code binary the Agent SDK resolves out of node_modules at runtime.
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**

# Without the ad hoc re-sign after the flip an unsigned build does not start (docs/releasing.md).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Required for notarisation. Harmless on unsigned builds — the flag only
  # takes effect once a signing identity is present.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  # The helpers, node-pty's spawn-helper and the bundled claude binary.
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # macOS 15 refuses an unsigned download outright rather than warning, so an
  # unsigned build needs the instructions in docs/releasing.md.
  minimumSystemVersion: '13.0'
  # macOS asks before an app reads Desktop or Documents, and with no reason in
  # Info.plist it may refuse without asking at all. The board folder is often on
  # the Desktop, which iCloud syncs (docs/data/board.md).
  extendInfo:
    NSDesktopFolderUsageDescription: Octopus reads and writes the task board folder you chose on your Desktop.
    NSDocumentsFolderUsageDescription: Octopus reads and writes the task board folder you chose in Documents.

dmg:
  title: ${productName} ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
